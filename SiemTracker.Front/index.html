<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiemTracker - Dashboard SOC</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .container { max-width: 900px; margin: auto; }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0284c7;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0369a1; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th { background-color: #334155; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ SiemTracker - Painel de Segurança</h1>

        <!-- Formulário para Enviar um Log -->
        <div class="card">
            <h3>Registrar Novo Log de Segurança</h3>
            <form id="logForm">
                <label>Mensagem do Evento:</label>
                <input type="text" id="message" placeholder="Ex: Tentativa de login falha" required>

                <label>Nível de Severidade:</label>
                <input type="text" id="level" placeholder="Ex: Warning, Critical, Info" required>

                <button type="submit">Enviar Log para o Servidor</button>
            </form>
        </div>

        <!-- Tabela de Logs Recebidos -->
        <div class="card">
            <h3>Logs Armazenados no SQLite</h3>
            <button onclick="carregarLogs()" style="width: auto; padding: 8px 15px; margin-bottom: 10px;">Atualizar Lista</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Mensagem</th>
                        <th>Severidade</th>
                        <th>Data/Hora</th>
                    </tr>
                </thead>
                <tbody id="tabelaLogs">
                    <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Carregando logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/'; // Ajuste a porta se necessário conforme seu terminal

        // Função para buscar os logs do backend
        async function carregarLogs() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`A API respondeu com status ${response.status}.`);
                }

                const logs = await response.json();
                
                const tbody = document.getElementById('tabelaLogs');
                tbody.innerHTML = '';

                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94a3b8;">Nenhum log registrado ainda.</td></tr>';
                    return;
                }

                logs.forEach(log => {
                    const tr = document.createElement('tr');
                    const values = [
                        log.id || 'N/A',
                        log.message || 'Sem mensagem',
                        log.severity || 'INFO',
                        log.timestamp ? new Date(log.timestamp).toLocaleString('pt-BR') : 'Agora'
                    ];

                    values.forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Erro ao buscar logs:', error);
                document.getElementById('tabelaLogs').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #f87171;">Erro ao conectar com a API. O backend está rodando?</td></tr>';
            }
        }

        // Função para enviar um novo log via POST
        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = document.getElementById('message').value;
            const severity = document.getElementById('level').value;

            const novoLog = {
                source: 'Painel Web',
                message,
                severity,
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoLog)
                });

                if (response.ok) {
                    alert('Log enviado com sucesso!');
                    document.getElementById('logForm').reset();
                    carregarLogs(); // Atualiza a tabela na hora
                } else {
                    const errorDetails = await response.text();
                    console.error('Erro ao enviar o log:', response.status, errorDetails);
                    alert(`Erro ao enviar o log (HTTP ${response.status}).`);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão com o servidor.');
            }
        });

        // Carregar os logs assim que abrir a página
        carregarLogs();
    </script>
</body>
</html>
